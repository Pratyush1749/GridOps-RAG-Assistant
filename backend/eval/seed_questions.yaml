# ==================== RERANK (4) — discriminate among near-duplicate generated docs ====================

- id: q-006
  question: "What was the reported cause of outage #12, and how many customers did it affect?"
  intent: rag
  golden_sources:
    - outage-postmortem-0012.txt
  golden_answer_keywords:
    - overload
    - "3565"
  demonstrates_feature: rerank
  expected_baseline: fail
  expected_with_feature: pass
  notes: "Outage #12 is one of 150 structurally near-identical post-mortem docs. Dense embeddings discriminate poorly on an exact ID number embedded in otherwise-boilerplate text — this is the hardest rerank case in the set. Verified against DB: outage_id=12, cause=overload, customers_affected=3565."

- id: q-007
  question: "What is the manufacturer, capacity, and installation year of transformer XFMR-00141?"
  intent: rag
  golden_sources:
    - transformer-inspection-0141.txt
  golden_answer_keywords:
    - Schneider Electric
    - "2005"
  demonstrates_feature: rerank
  expected_baseline: fail
  expected_with_feature: pass
  notes: "One of 100 near-identical transformer inspection reports. Verified against DB: transformer_id=141, manufacturer=Schneider Electric, install_year=2005, capacity=54.98 MVA."

- id: q-008
  question: "How many feeders does substation sub-portjesseville-016 have, and how many outages has it recorded?"
  intent: rag
  golden_sources:
    - substation-profile-016.html
  golden_answer_keywords:
    - "18"
    - "25"
  demonstrates_feature: rerank
  expected_baseline: fail
  expected_with_feature: pass
  notes: "One of 50 near-identical substation profiles. Verified against DB: substation_id=16, n_feeders=18, n_outages=25 (the highest outage count of any substation, a natural 'worst performer' probe)."

- id: q-009
  question: "What is the reliability history for feeder feeder-042-0077?"
  intent: rag
  golden_sources:
    - feeder-summary-0077.html
  golden_answer_keywords:
    - outage
