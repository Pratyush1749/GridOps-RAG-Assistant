# GridOps eval goldens (40-question set).
#
# Covers the 8 hand-authored procedural docs, the 422 generated operational
# records (substation profiles / outage post-mortems / transformer
# inspections / feeder summaries / regional reports / storm reports) in
# seed/docs/true_data/, and the grid_ops database schema
# (seed/migrations/003_seed_grid_ops.sql). Facts referenced below (outage
# IDs, transformer asset tags, aggregate counts) were pulled directly from
# the seeded DB, not guessed.

